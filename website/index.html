<style>
  /* The source's page, drawn as the app's own splash on the iPhone (app/SP2TabController.m SP2SplashSceneMake) so the web
     and the app are one look (user 2026-10-29: "khác hoàn toàn style của sideplay2 trên iphone rồi, làm lại đi; Sileo |
     Zebra không cần để trong button, để 2 bên ngăn cách dấu gạch"): the iPhone's grey (night blue in dark), two soft lights
     under the icon, the ring of light turning round it every 10 s, the icon floating, SidePlay2 in the system font with the
     splash's gradient, the address small and faint under it (a tap copies it), then Sileo | Zebra as two words with a line
     between. Sizes are the splash's points (k = 1 on an iPhone). No version and no description: the page never needs
     changing for an update.
     Light and dark in one picture, split by a line you drag, as an image comparison slider (user 2026-10-29: "làm nửa
     trắng nửa đen, rồi có kéo qua kéo lại đc như chức năng chia đôi màn của sideplay2", then "làm như kiểu juxtapose á, cho
     chân thật, giờ nhìn chưa mượt lắm"): the light page whole underneath, the dark page over it seen only right of the line,
     no seam, a thin white line with SidePlay2's divider grabber on it. Drag the handle or anywhere on the page, or click to send the line
     there; it glides after the pointer. Only transforms move (the dark page's window slides right while the page inside
     slides back left by as much), so it stays smooth. The place is remembered in this browser. */
  :root {
    --k: min(1.3px, calc(100vw / 375), calc(100vh / 680));   /* one splash point */
    --x: 50vw;   /* the line */
  }
  .light {
    --bg: #f2f2f7;
    --blue: #1f7aff;
    --orb-a: radial-gradient(ellipse calc(260 * var(--k)) calc(245 * var(--k)) at calc(50% - 60 * var(--k)) calc(50% - 40 * var(--k)), rgba(90,200,250,0.6) 0%, rgba(90,200,250,0.48) 18%, rgba(90,200,250,0.33) 36%, rgba(90,200,250,0.192) 54%, rgba(90,200,250,0.084) 72%, rgba(90,200,250,0.024) 87%, rgba(90,200,250,0.0) 100%);
    --orb-b: radial-gradient(ellipse calc(170 * var(--k)) calc(185 * var(--k)) at calc(50% + 60 * var(--k)) calc(50% + 40 * var(--k)), rgba(31,122,255,0.4) 0%, rgba(31,122,255,0.32) 18%, rgba(31,122,255,0.22) 36%, rgba(31,122,255,0.128) 54%, rgba(31,122,255,0.056) 72%, rgba(31,122,255,0.016) 87%, rgba(31,122,255,0.0) 100%);
    --ring-a: rgba(31,122,255,.45);
    --ring-b: rgba(90,200,250,.4);
    --glow: rgba(31,122,255,.35);
    --edge: rgba(0,0,0,.05);
    --name: linear-gradient(120deg, #0b0d12 10%, #1f4fa8 55%, #1f7aff 100%);
    --ink: #0b0d12;
    --line: rgba(0,0,0,.14);
    --soft: rgba(0,0,0,.5);
    --done: #1f9d45;
  }
  .dark {
    --bg: #05080e;
    --blue: #5aa6ff;
    --orb-a: radial-gradient(ellipse calc(260 * var(--k)) calc(245 * var(--k)) at calc(50% - 60 * var(--k)) calc(50% - 40 * var(--k)), rgba(31,122,255,0.55) 0%, rgba(31,122,255,0.44) 18%, rgba(31,122,255,0.3025) 36%, rgba(31,122,255,0.176) 54%, rgba(31,122,255,0.077) 72%, rgba(31,122,255,0.022) 87%, rgba(31,122,255,0.0) 100%);
    --orb-b: radial-gradient(ellipse calc(170 * var(--k)) calc(185 * var(--k)) at calc(50% + 60 * var(--k)) calc(50% + 40 * var(--k)), rgba(94,92,230,0.4) 0%, rgba(94,92,230,0.32) 18%, rgba(94,92,230,0.22) 36%, rgba(94,92,230,0.128) 54%, rgba(94,92,230,0.056) 72%, rgba(94,92,230,0.016) 87%, rgba(94,92,230,0.0) 100%);
    --ring-a: rgba(90,166,255,.55);
    --ring-b: rgba(31,122,255,.35);
    --glow: rgba(31,122,255,.55);
    --edge: rgba(255,255,255,.08);
    --name: linear-gradient(120deg, #ffffff 10%, #9cc8ff 55%, #1f7aff 100%);
    --ink: #ffffff;
    --line: rgba(255,255,255,.18);
    --soft: rgba(255,255,255,.5);
    --done: #30d158;
  }
  * { box-sizing: border-box; }
  /* the page never zooms or grows wider than the screen, so its two sides stay framed (user 2026-10-29: "bên mobile khoá
     cứng zoom in hay out để không bị lệch khung hình web"): no zoom in the viewport (Android), Safari's pinch and double tap
     stopped in the script and by touch-action (iOS ignores user-scalable), and what slides sideways (the dark copy, the
     line) sits in frames that clip it, so nothing reaches past the right edge */
  html { background: #f2f2f7; scroll-snap-type: y proximity; overflow-x: hidden; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { margin: 0; position: relative; overflow-x: hidden; touch-action: pan-x pan-y; }
  .clip { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .clip > .cut { pointer-events: auto; }
  .rail { position: fixed; inset: 0; z-index: 5; overflow: hidden; pointer-events: none; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .site { position: relative; background: var(--bg); color: var(--ink); }
  .hero { position: relative; height: 100vh; height: 100svh; overflow: hidden; scroll-snap-align: start; touch-action: pan-y; display: flex; flex-direction: column; align-items: center; text-align: center;
    padding: 0 16px 80px; }
  /* the dark page's window (the whole page, both sections): it slides to the line, its page slides back, so the page stays
     put and only its left edge moves; the line itself stays on the screen as it scrolls */
  .cut { position: absolute; inset: 0; overflow: hidden; transform: translate3d(var(--x), 0, 0); will-change: transform; }
  .cut > .site { position: absolute; top: 0; left: 0; width: 100%; transform: translate3d(calc(-1 * var(--x)), 0, 0); will-change: transform; }

  /* the line and its handle */
  .handle { position: fixed; z-index: 5; top: 0; bottom: 0; left: 0; width: 0; transform: translate3d(var(--x), 0, 0); will-change: transform; pointer-events: none; }
  .handle::before { content: ""; position: absolute; top: 0; bottom: 0; left: -1px; width: 2px; background: rgba(255,255,255,.92);
    box-shadow: 0 0 0 .5px rgba(0,0,0,.1), 0 0 14px rgba(0,0,0,.28); }
  /* the handle is SidePlay2's divider grabber (Studio gripHtml; user 2026-10-29: "icon này làm kiểu sideplay2, mảnh hơn"):
     a slim capsule with three fine lines, blue under the mouse or finger; its hit area is wider than it looks */
  .knob { position: absolute; left: -22px; top: 50%; width: 44px; height: 84px; margin-top: -42px; display: grid; place-items: center;
    pointer-events: auto; touch-action: none; outline: none; -webkit-tap-highlight-color: transparent; }
  .knob b { position: relative; width: 12px; height: 56px; border-radius: 999px; background: rgba(242,242,247,.96);
    box-shadow: 0 0 0 .5px rgba(0,0,0,.16), 0 2px 8px rgba(0,0,0,.45); transition: transform .2s cubic-bezier(.2,.8,.2,1), background .15s; }
  .knob i { position: absolute; left: 3.5px; right: 3.5px; height: 1px; border-radius: 1px; background: rgba(11,13,18,.55); transition: background .15s; }
  .knob i:nth-child(1) { top: calc(50% - 4.5px); }
  .knob i:nth-child(2) { top: calc(50% - .5px); }
  .knob i:nth-child(3) { top: calc(50% + 3.5px); }
  .knob:hover b, .knob:focus-visible b, .held .knob b { background: #1f7aff; transform: scale(1.12); }
  .knob:hover i, .knob:focus-visible i, .held .knob i { background: #fff; }
  .held, .held * { user-select: none; -webkit-user-select: none; }

  /* the icon's centre at 40 % of the height, as on the iPhone; the ring (380) and the lights (520, 40 below) round it */
  .stage { position: relative; flex: none; margin-top: calc(40vh - 190 * var(--k)); margin-top: calc(40svh - 190 * var(--k));
    width: calc(380 * var(--k)); height: calc(380 * var(--k)); display: grid; place-items: center; }
  /* each light is the splash's 520 layer (its focus off centre, as CAGradientLayer draws it) in a box twice as big, faded by
     the wallpaper's soft stops: the splash's three stops showed a hard rim on a wide screen (user 2026-10-29: "ánh sáng
     phía sau bên tối đang bị lỗi"). Light draws them stronger than the splash's .35/.18 so their swing shows on the grey (user
     2026-10-29: "ở tối chuyển động thì sáng cũng phải chuyển động") */
  .orb { position: absolute; left: 50%; top: calc(50% + 40 * var(--k)); width: calc(1040 * var(--k)); height: calc(1040 * var(--k));
    margin: calc(-520 * var(--k)) 0 0 calc(-520 * var(--k)); pointer-events: none; transition: opacity .5s; }
  .orb.a { background: var(--orb-a); animation: swingA 8s ease-in-out infinite alternate; }
  .orb.b { background: var(--orb-b); animation: swingB 10s ease-in-out infinite alternate; }
  @keyframes swingA { from { transform: translate(calc(-60 * var(--k)), calc(-20 * var(--k))); } to { transform: translate(calc(70 * var(--k)), calc(30 * var(--k))) scale(1.12); } }
  @keyframes swingB { from { transform: translate(calc(70 * var(--k)), calc(30 * var(--k))) scale(1.12); } to { transform: translate(calc(-60 * var(--k)), calc(-20 * var(--k))); } }
  .ring { position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    background: conic-gradient(transparent 0deg, var(--ring-a) 40deg, transparent 90deg, transparent 180deg, var(--ring-b) 220deg, transparent 270deg);
    -webkit-mask-image: radial-gradient(closest-side, transparent 76%, #000 79%, #000 81%, transparent 90%);
    mask-image: radial-gradient(closest-side, transparent 76%, #000 79%, #000 81%, transparent 90%);
    animation: turn 10s linear infinite; }
  @keyframes turn { to { transform: rotate(360deg); } }
  .icon { position: relative; width: calc(104 * var(--k)); height: calc(104 * var(--k)); border-radius: calc(24 * var(--k));
    box-shadow: 0 calc(18 * var(--k)) calc(72 * var(--k)) var(--glow); animation: float 3s ease-in-out infinite alternate; }
  .icon img { display: block; width: 100%; height: 100%; border-radius: inherit; }
  .icon::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px var(--edge); }
  @keyframes float { to { transform: translateY(calc(-8 * var(--k))); } }

  /* SidePlay2 38 under the icon: 49 bold, the splash's gradient */
  h1 { margin: calc(-190 * var(--k) + 52 * var(--k) + 38 * var(--k)) 0 0; font-size: calc(49 * var(--k)); line-height: 1.2; font-weight: 700; letter-spacing: calc(-.6 * var(--k));   /* the splash's -1.7, opened a little (user 2026-10-29: "SidePlay2 cũng dãn ra tí") */
    padding: 0 .06em; background: var(--name); -webkit-background-clip: text; background-clip: text; color: transparent; position: relative; }
  /* the address just under the name, small, faint and in lower case, no dot (user 2026-10-29: "dòng này viết thường, mờ mờ
     nhỏ lại sát lên trên tí, bỏ cái icon tròn ở trước"; then thin, its letters spaced: "đừng đậm quá", "spacing dãn ra", "mảnh lại nữa": SF Ultralight, and Inter
     200 where there is no SF: Windows drew Segoe UI as good as regular); a tap
     copies it */
  .addr { position: relative; margin-top: calc(2 * var(--k)); padding: 6px 0; font: 200 max(12px, calc(13 * var(--k))) / 1.2 -apple-system, BlinkMacSystemFont, Inter, sans-serif; letter-spacing: .16em; padding-left: .16em;
    color: var(--soft); background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: color .25s; }
  .addr:hover { color: var(--blue); }
  .addr.done { color: var(--done); }

  /* Sileo | Zebra at the bottom, where the splash has its version line (user 2026-10-29: "ở dưới và nhỏ mảnh thôi"):
     two small light words and a hairline between */
  .get { position: absolute; left: 0; right: 0; bottom: max(28px, calc(env(safe-area-inset-bottom) + 16px)); display: flex; justify-content: center; align-items: center; }
  .get a { padding: 10px 16px; font-size: 13px; font-weight: 400; letter-spacing: .06em;
    color: var(--soft); text-decoration: none; transition: color .2s, opacity .2s; -webkit-tap-highlight-color: transparent; }
  .get a:hover { color: var(--blue); }
  .get a:active { opacity: .5; }
  .get span { width: 1px; height: 11px; background: var(--line); }

  /* the mouse (user 2026-10-29: "làm hiệu ứng chuột trong web ảo ảo tí"): the lights and the ring drift after it at two
     depths and the icon leans toward it with a gleam on its glass; the mouse itself stays the plain arrow, no light round it
     and no resize cursor (user 2026-10-29: "icon chuột bỏ hiệu ứng đi, đổi lại bình thường"). --mx / --my run -1…1 from the page's
     centre, eased in the script; a phone (no hover) and reduced motion keep the page still */
  :root { --mx: 0; --my: 0; --on: 0; }
  .drift { position: absolute; inset: 0; pointer-events: none; }
  .drift.deep { transform: translate3d(calc(var(--mx) * 26 * var(--k)), calc(var(--my) * 20 * var(--k)), 0); }
  .drift.near { transform: translate3d(calc(var(--mx) * -10 * var(--k)), calc(var(--my) * -8 * var(--k)), 0); }
  .tilt { position: relative; transform: perspective(calc(700 * var(--k))) rotateY(calc(var(--mx) * 12deg)) rotateX(calc(var(--my) * -12deg)); }
  .icon::before { content: ""; position: absolute; inset: 0; z-index: 1; border-radius: inherit; pointer-events: none; opacity: calc(var(--on) * .9);
    background: radial-gradient(circle at calc(50% + var(--mx) * 60%) calc(50% + var(--my) * 60%), rgba(255,255,255,.32), rgba(255,255,255,0) 55%);
    mix-blend-mode: soft-light; }

  /* the light side is in English, the dark side in Vietnamese (user 2026-10-29: "bên màu trắng sẽ là English, màu đen sẽ là
     Tiếng Việt"), each with its own pictures (tools/wallpaper/shots.py web: <name>-light.jpg, <name>-dark.jpg) */
  /* section 2, Xem trước (user 2026-10-29: "lăn chuột xuống sẽ là section 2, nơi đây thể hiện 1 loạt ảnh xem trước giống
     bên sileo, gallery"): the Sileo page's five pictures (assets/shots, tools/wallpaper/shots.py) in a row that swipes
     sideways, as an App Store gallery; the two copies of the row (light, dark) scroll as one (the script) */
  .more { min-height: 100vh; min-height: 100svh; padding: 88px 0 96px; display: flex; flex-direction: column; justify-content: center; scroll-snap-align: start; }
  .more h2 { margin: 0 0 30px; padding: 0 24px; text-align: center; font-size: 30px; line-height: 1.2; font-weight: 700; letter-spacing: -.4px;
    background: var(--name); -webkit-background-clip: text; background-clip: text; color: transparent; width: fit-content; align-self: center; }
  .shots { display: flex; gap: 18px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch;
    padding: 70px 24px 80px; margin: -60px 0 -40px; scroll-padding: 0 24px; }   /* room in the row for the pictures' glow and shadow (a
     sideways scroller clips both ways: user 2026-10-29 "vệt sáng thấy vết cắt rồi"), given back by the margins */
  .shots::-webkit-scrollbar { display: none; }
  .shots::before, .shots::after { content: ""; margin: auto; }   /* centred while the row fits, from the left once it does not */
  .shots figure { flex: none; margin: 0; width: clamp(176px, calc((100vw - 150px) / 5), 228px); scroll-snap-align: start; }   /* all five side by side on a wide screen */
  .shots img { display: block; width: 100%; height: auto; aspect-ratio: 900 / 1950; border-radius: 24px; background: var(--shotbg); box-shadow: var(--shot);
    -webkit-user-drag: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }   /* the mouse drags the line, not a picture */
  .light { --shotbg: #e6e9ef; --shot: 0 0 0 .5px rgba(0,0,0,.06), 0 18px 40px -12px rgba(10,20,40,.35); }
  .dark { --shotbg: #05080e; --shot: 0 0 0 .5px rgba(255,255,255,.1), 0 18px 50px -10px rgba(0,0,0,.8), 0 0 60px -20px rgba(31,122,255,.35); }

  /* section 3, inside the car (user 2026-10-29: "background là trong xe, focus màn hình carplay đang dùng Sideplay2 chia
     đôi màn … 2 app này hoạt động thật", "YouTube + Google Maps", "người dùng có thể nhập tìm kiếm sài thử luôn"; then "cái
     thanh kéo sáng tối, ảnh hưởng tới section 3 luôn"): the car's screen, by day on the light side (English) and by
     night on the dark side (Vietnamese), split by the page's line like the sections above: the windscreen's lights out of
     focus, SidePlay2's lights behind it (below), and in focus its screen: CarPlay's sidebar and
     SidePlay2 with two panes, each with the app's tab bar (tab, three lights) as on the car, Google Maps on the left and
     YouTube on the right (/api/yt: YouTube's search, its own player), SidePlay2's grabber between them (drag, it holds at
     ½; tap ½ → ⅔ → ⅓). Everything is drawn twice (the light scene, the dark one in .dcut) except the two real apps: the
     map and the video player are one each, in .live over both, kept over their places (two would load and play twice);
     the YouTube list, its search box, the grabber are twice and kept as one by the script. A narrow screen splits top
     and bottom, as SidePlay2's Chia ngang. The apps load once the section comes near. */
  .split { position: relative; }
  .drive { position: relative; height: 100vh; height: 100svh; min-height: 560px; overflow: hidden; scroll-snap-align: start; }
  .drive .scene { position: absolute; inset: 0; overflow: hidden; isolation: isolate; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--s-bg); color: var(--s-ink); }
  /* its top fades from section 2's own colour, so the two run on without a seam (user 2026-10-29: "section 2 và 3 nối liền
     đồng bộ, đừng tạo vết cắt") */
  .drive .scene::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 30%; z-index: 1; pointer-events: none; background: linear-gradient(180deg, var(--s-top) 0%, var(--s-top) 12%, transparent 100%); }
  /* and its bottom fades into section 4's (the same colour), so the lights never meet that edge (user 2026-10-29: "giữa
     section 3 với 4 có vết cắt") */
  .drive .scene::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 30%; z-index: 1; pointer-events: none; background: linear-gradient(0deg, var(--s-top) 0%, var(--s-top) 12%, transparent 100%); }
  .scene.light { --s-top: #f2f2f7; }
  .scene.dark { --s-top: #05080e; }
  .dclip { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .dcut { position: absolute; inset: 0; overflow: hidden; pointer-events: auto; transform: translate3d(var(--x), 0, 0); will-change: transform; }
  .dcut > .scene { transform: translate3d(calc(-1 * var(--x)), 0, 0); will-change: transform; }
  .scene.light { --s-bg: #f2f2f7; --s-ink: #0b0d12;
    --s-sky: radial-gradient(120% 100% at 50% 100%, #ffffff 0%, #e6eef9 48%, #d3def0 100%);
    --s-dash: linear-gradient(180deg, #e4e7ed 0%, #cfd4dc 36%, #b8bec9 100%); --s-dash-edge: rgba(255,255,255,.9); --s-dash-glow: rgba(31,122,255,.08);
    --s-amb: linear-gradient(90deg, transparent, rgba(31,122,255,.55) 30%, rgba(90,200,250,.6) 70%, transparent); --s-amb-glow: rgba(31,122,255,.25);
    --s-wheel: #aeb4bf; --s-door: linear-gradient(180deg, #d9dee6 0%, #c3c9d3 55%, #aab1bd 100%); --s-door-edge: rgba(255,255,255,.55); --s-frame: #b7bdc8; --s-handle: #9aa2af;
    --s-glass: radial-gradient(60% 70% at 40% 60%, rgba(255,255,255,.95), rgba(214,232,255,.85) 55%, rgba(180,205,240,.8)); --s-title: linear-gradient(120deg, #0b0d12 10%, #1f4fa8 55%, #1f7aff 100%);
    --s-bezel: linear-gradient(180deg, #fbfbfc, #dfe2e8); --s-bezel-edge: rgba(0,0,0,.1); --s-bezel-shadow: 0 30px 70px rgba(30,50,90,.28), 0 0 120px rgba(31,122,255,.12);

  .gap b { position: relative; width: 10px; height: 48px; border-radius: 999px; background: rgba(242,242,247,.96); box-shadow: 0 0 0 .5px rgba(0,0,0,.2), 0 2px 8px rgba(0,0,0,.45); transition: transform .2s, background .15s; }
  .gap i { position: absolute; left: 3px; right: 3px; height: 1px; background: rgba(11,13,18,.55); }

  /* the speed bubble, SidePlay2's own (user 2026-10-29: "bong bóng phải giống sideplay2 luôn, vừa báo tốc độ xong đổi thành

     drawHudMessage), its sizes and colours as the car draws them: the date and battery strip, the speed (amber near the
     limit, the card pulsing red past it), the 60 sign, and the camera tile once it is 400 m off; a message takes the
     bubble's place in the same card, what was inside sliding out downwards as it comes in, and gives it back after its
     seconds; dragged anywhere inside SidePlay2's panes (kept as a share of the room), a tap: Nhỏ → Vừa → Lớn, a tap on a
     message closes it. Pretend: the script drives it. One card, never cut by the light / dark line (its two languages
     side by side read as a fault: user 2026-10-29 "bong bóng bị lỗi"): light and English, or dark and Vietnamese, as the
     side its middle is on */
  .hudlayer { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
  .hcard { --surface: #1a1e28; --dim: #9aa3b5; --ink: #fff; --ink86: rgba(255,255,255,.86); --ink90: rgba(255,255,255,.9); --ink10: rgba(255,255,255,.1); --ink08: rgba(255,255,255,.08); --ink50: rgba(255,255,255,.5);
    position: absolute; left: 0; top: 0; border-radius: calc(18px * var(--hs, 1)); overflow: hidden; touch-action: none; cursor: grab; pointer-events: auto;
    background: rgba(26,30,40,.92); color: var(--ink); border: 1px solid var(--ink10); box-sizing: border-box; -webkit-user-select: none; user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, system-ui, sans-serif; }
  .hcard.light { --surface: #fff; --dim: #6b7280; --ink: #000; --ink86: rgba(0,0,0,.86); --ink90: rgba(0,0,0,.9); --ink10: rgba(0,0,0,.1); --ink08: rgba(0,0,0,.08); --ink50: rgba(0,0,0,.5);
    background: rgba(255,255,255,.92); }
  .hcard.msgmode { background: var(--surface); }
  .hcard.held { cursor: grabbing; }
  .hcard.over::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: #ff5a5f; animation: overpulse 1.2s ease-in-out infinite; pointer-events: none; z-index: 0; }
  .hcard.over > * { z-index: 1; }

  .hframe { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; transform-origin: 0 0; }
  .hstrip { height: 26px; flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; margin: 0 12px; border-bottom: 1px solid var(--ink08);
    font-size: 12px; font-weight: 600; color: var(--ink86); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .appi.mg { background: linear-gradient(135deg, rgb(0,178,255) 0%, rgb(0,106,255) 45%, rgb(160,51,255) 100%); }
  .appi.zl { background: rgb(0,104,255); }
  .hbody { flex: 1; display: flex; align-items: flex-start; padding: 6px 12px 3px; min-height: 0; }

  /* section 4, the call to try it (user 2026-10-29: "CTA đơn giản, kêu gọi dùng thử …", then "đơn giản hơn nữa: Nhập mã
     SIDENEW để dùng thử 60 ngày, rồi button Sileo | Zebra, footer Email SidePlay | Fanpage SidePlay"): no logo, no lights ("không cần logo +
     vòng xoay"): the code on one line and the trial small and faint under it (alike in both languages, so the two sides stay level), the two ways in,
     and the two links at the bottom. Light (English) and dark (Vietnamese) under the line */
  .cta { position: relative; height: 100vh; height: 100svh; min-height: 520px; overflow: hidden; scroll-snap-align: start;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 24px; }
  /* the code on the left, the app's own Nhập mã kích hoạt on the right playing out (user 2026-10-29: "bên trái là nhập mã
     SIDENEW, bên phải là mockup điện thoại phần nhập mã thật, dạng animation thể hiện kích hoạt thành công", "lấy mockup
     trong studio", "dùng code luôn"): the Studio itself (below),
     not activated until the visitor does it: copy SIDENEW (a tap on it), paste it, Kích hoạt; "Đang kiểm tra…", then
     Trạng thái shows it on (no popup: the app has none), dated the visitor's today and today + 30 days (60 before SidePlay2 2.0, user 2026-11-12); any other code gets
     the app's Không kích hoạt được popup, Đóng closes it. Its tab bar opens the app's Trang chủ, Trên xe, Mô phỏng as the
     Studio draws them (user 2026-10-29: "mockup luôn trang chủ, trên xe, mô phỏng"). A narrow screen puts the phone under
     the words */
  .crow { position: relative; display: flex; align-items: center; justify-content: center; gap: clamp(48px, 8vw, 120px); }
  .ctext { display: flex; flex-direction: column; align-items: flex-start; text-align: left; }
  @media (min-width: 761px) { .ctext { width: min(470px, 36vw); } }   /* one width in both languages, so the two phones stand on the same spot (user 2026-10-29: "khung hình 2 điện thoại chưa khớp") */
  /* the phone is the Studio itself, live (functions/live: from R2, framed by this page only), light in English on the
     light side and dark in Vietnamese on the dark one, the two kept as one by the page (user 2026-10-29: "dùng y đúc
     studio", "kết nối động, gallery trượt động, nút thao tác được, mô phỏng", "đăng nguyên studio nhưng phải bảo mật",
     "kéo sáng tối, anh/việt cũng phải ảnh hưởng lên studio"); the frame is the phone's size plus the Studio's 18 px round it */
  .cphone { --ph: min(64vh, 580px); flex: none; height: var(--ph); width: calc((var(--ph) - 36px) * .46182 + 36px); }
  .cframe { display: block; width: 100%; height: 100%; border: 0; background: transparent; color-scheme: normal;
    filter: drop-shadow(0 22px 34px rgba(10,20,40,.28)); }   /* the phone's shadow, round its own shape: inside the frame its edge cut it square (user 2026-10-29: "có viền cắt") */
  @media (max-width: 760px) {
    .crow { flex-direction: column; gap: 26px; }
    .ctext { align-items: center; text-align: center; }
    .cphone { --ph: min(52vh, 450px); }
  }

      var HOME = [{"id": "knW7-x7Y7RE", "title": "SƠN TÙNG M-TP | HÃY TRAO CHO ANH ft. Snoop Dogg | Official MV", "channel": "Sơn Tùng M-TP Official"}, {"id": "Llw9Q6akRo4", "title": "LẠC TRÔI | OFFICIAL MUSIC VIDEO | SƠN TÙNG M-TP", "channel": "Sơn Tùng M-TP Official"}, {"id": "FN7ALfpGxiI", "title": "NƠI NÀY CÓ ANH | OFFICIAL MUSIC VIDEO | SƠN TÙNG M-TP", "channel": "Sơn Tùng M-TP Official"}, {"id": "abPmZCZZrFA", "title": "SƠN TÙNG M-TP | ĐỪNG LÀM TRÁI TIM ANH ĐAU | OFFICIAL MUSIC VIDEO", "channel": "Sơn Tùng M-TP Official"}, {"id": "60ItHLz5WEA", "title": "Alan Walker - Faded", "channel": "Alan Walker"}, {"id": "JGwWNGJdvx8", "title": "Ed Sheeran - Shape of You (Official Music Video)", "channel": "Ed Sheeran"}, {"id": "kJQP7kiw5Fk", "title": "Luis Fonsi - Despacito ft. Daddy Yankee", "channel": "LuisFonsiVEVO"}, {"id": "RgKAFK5djSk", "title": "Wiz Khalifa - See You Again ft. Charlie Puth [Official Video] Furious 7 Soundtrack", "channel": "Wiz Khalifa Music"}, {"id": "OPf0YbXqDm0", "title": "Mark Ronson - Uptown Funk (Official Video) ft. Bruno Mars", "channel": "MarkRonsonVEVO"}, {"id": "hT_nvWreIhg", "title": "OneRepublic - Counting Stars", "channel": "OneRepublicVEVO"}, {"id": "YQHsXMglC9A", "title": "Adele - Hello (Official Music Video)", "channel": "Adele"}, {"id": "9bZkp7q19f0", "title": "PSY - GANGNAM STYLE(강남스타일) M/V", "channel": "officialpsy"}];
      var lists = all(".list"), boxes = all(".yq");
      var plain = function (t) { return (t || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d"); };
      var draw = function (items) {
        lists.forEach(function (list) {
          var lang = list.closest(".scene").lang;
          list.textContent = "";
          if (!items.length) { var p = document.createElement("p"); p.textContent = WORDS[lang].none; list.appendChild(p); return; }
          items.forEach(function (v) {
            var b = document.createElement("button"), img = document.createElement("img"), t = document.createElement("b"), c = document.createElement("small");
            b.type = "button"; img.src = v.thumb || "https://i.ytimg.com/vi/" + v.id + "/mqdefault.jpg"; img.alt = ""; img.loading = "lazy";
            t.textContent = v.title; c.textContent = v.channel || "";
            b.append(img, t, c); b.onclick = function () { play(v); };
            list.appendChild(b);
          });
          list.scrollTop = 0;
        });
      };
      var leading = null, settle;   // the two lists scroll as one
      lists.forEach(function (list) {
        list.addEventListener("scroll", function () {
          if (leading && leading !== list) return;
          leading = list; clearTimeout(settle); settle = setTimeout(function () { leading = null; }, 120);
          lists.forEach(function (o) { if (o !== list) o.scrollTop = list.scrollTop; });
        }, { passive: true });
      });
      boxes.forEach(function (box) { box.addEventListener("input", function () { boxes.forEach(function (o) { if (o !== box) o.value = box.value; }); }); });
      var ask = function (q) {
        return fetch("/api/yt" + (q ? "?q=" + encodeURIComponent(q) : "")).then(function (r) { return r.json(); }).catch(function () { return { items: [] }; }).then(function (d) {
          if (d.items && d.items.length) return d.items;
          if (!q) return HOME;
          var w = plain(q).split(/\s+/);
          return HOME.filter(function (v) { var t = plain(v.title + " " + v.channel); return w.every(function (x) { return t.indexOf(x) >= 0; }); });
        });
      };
      var close = function () { watching = false; all(".watch").forEach(function (w) { w.hidden = true; }); playSlot.hidden = true; playSlot.textContent = ""; };
      var play = function (v) {
        all(".watch").forEach(function (w) { w.hidden = false; w.querySelector(".wtitle").textContent = v.title; });
        playSlot.textContent = "";
        var f = document.createElement("iframe");
        f.title = v.title; f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen"; f.allowFullscreen = true;
        f.src = "https://www.youtube-nocookie.com/embed/" + v.id + "?autoplay=1&playsinline=1&rel=0";
        playSlot.appendChild(f); playSlot.hidden = false; watching = true; cover();
      };
      all(".back").forEach(function (b) { b.onclick = close; });
      all(".ysearch").forEach(function (form) {
        form.addEventListener("submit", function (e) {
          e.preventDefault(); var q = form.querySelector(".yq").value.trim();
          close(); ask(q).then(draw); document.activeElement.blur();
        });
      });

      // the two apps start once section 3 comes near
      var start = function () { if (started) return; started = true; showMap("Landmark 81, Thành phố Hồ Chí Minh"); ask("").then(draw); place(); window.hudStart(); };
      var watchScroll = function () { if (drive.getBoundingClientRect().top < innerHeight + 400) start(); };
      addEventListener("scroll", watchScroll, { passive: true }); addEventListener("resize", watchScroll); watchScroll();
      window.sp2Line(r * wide());
    })();
    // ---- section 4: the Studio, live, twice (light / English, dark / Vietnamese); what one does is handed to the other
    (function () {
      var cta = document.querySelector(".cta"), frames = Array.prototype.slice.call(document.querySelectorAll(".cframe")), going = false;
      // Email in the footer copies the address, "Copied" / "Đã chép" for a moment
      var mailTimer;
      document.querySelectorAll(".foot .mail").forEach(function (m) {
        m.addEventListener("click", function () {
          var done = function () { document.querySelectorAll(".foot .mail").forEach(function (o) { o.classList.add("done"); o.textContent = o.getAttribute("data-done"); }); clearTimeout(mailTimer);
            mailTimer = setTimeout(function () { document.querySelectorAll(".foot .mail").forEach(function (o) { o.classList.remove("done"); o.textContent = "Email"; }); }, 1600); };
          if (navigator.clipboard) navigator.clipboard.writeText("Sideplay.gg@gmail.com").then(done, done); else done();
        });
      });
      var copiedTimer;   // its mark turns a tick for a moment (no words over it: user 2026-10-29 "bỏ cái ô này")
      document.querySelectorAll(".ccode").forEach(function (c) {
        c.addEventListener("click", function () {
          var done = function () { document.querySelectorAll(".ccode").forEach(function (o) { o.classList.add("done"); }); clearTimeout(copiedTimer);
            copiedTimer = setTimeout(function () { document.querySelectorAll(".ccode").forEach(function (o) { o.classList.remove("done"); }); }, 1600); };
          if (navigator.clipboard) navigator.clipboard.writeText("SIDENEW").then(done, done); else done();
        });
      });
      addEventListener("message", function (e) {
        if (e.origin !== location.origin || !e.data || !(e.data.sp2sync || e.data.sp2scroll)) return;
        frames.forEach(function (f) { if (f.contentWindow && f.contentWindow !== e.source) f.contentWindow.postMessage(e.data, location.origin); });
      });
      // the phones load early, waiting on the app's splash; once the section is half in view both open the app together
      // (splash, then Trang chủ), and again each time it comes back after leaving the screen
      var ready = 0, opened = false;
      frames.forEach(function (f) { f.addEventListener("load", function () { setTimeout(function () { ready++; open(); }, 400); }); });
      var open = function () {
        var b = cta.getBoundingClientRect();
        if (b.top >= innerHeight || b.bottom <= 0) { opened = false; return; }   // gone: it opens again next time
        if (opened || ready < frames.length || b.top > innerHeight * .5 || b.bottom < innerHeight * .3) return;
        opened = true; frames.forEach(function (f) { f.contentWindow.postMessage({ sp2open: 1 }, location.origin); });
      };
      var near = function () {
        if (!going && cta.getBoundingClientRect().top < innerHeight + 900) { going = true; frames.forEach(function (f) { f.src = f.getAttribute("data-src"); }); }
        open();
      };
      addEventListener("scroll", near, { passive: true }); near();
    })();

    // the first visit: the line sweeps once, so it is seen to move
    if (isNaN(saved)) setTimeout(function () { go(.38); setTimeout(function () { go(.62); setTimeout(function () { go(.5); }, 650); }, 650); }, 1200);

    // the mouse: the depths ease after it (see .drift / .tilt)
    if (!matchMedia("(hover: hover) and (pointer: fine)").matches || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var tx = 0, ty = 0, mx = 0, my = 0, on = 0, aim = 0, run = false;
    var step = function () {
      mx += (tx - mx) * .07; my += (ty - my) * .07; on += (aim - on) * .08;
      root.setProperty("--mx", mx.toFixed(4)); root.setProperty("--my", my.toFixed(4)); root.setProperty("--on", on.toFixed(3));
      run = Math.abs(tx - mx) + Math.abs(ty - my) + Math.abs(aim - on) > .001;
      if (run) requestAnimationFrame(step);
    };
    var wake = function () { if (!run) { run = true; requestAnimationFrame(step); } };
    addEventListener("pointermove", function (e) {
      tx = (e.clientX / innerWidth - .5) * 2; ty = (e.clientY / innerHeight - .5) * 2; aim = 1; wake();
    }, { passive: true });
    document.addEventListener("pointerleave", function () { tx = 0; ty = 0; aim = 0; wake(); });
  })();
</script>
