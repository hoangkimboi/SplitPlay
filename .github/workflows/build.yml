name: Build SplitPlay2 (.deb)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    strategy:
      matrix:
        scheme: [rootless, rootful]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=~/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Download iOS 16.5 SDK
        run: |
          cd ~/theos/sdks
          curl -LO https://github.com/theos/sdks/releases/download/1700/iPhoneOS16.5.sdk.tar.xz
          tar -xf iPhoneOS16.5.sdk.tar.xz
          rm iPhoneOS16.5.sdk.tar.xz

      - name: Build Tweak (.deb)
        run: |
          export THEOS=~/theos
          make clean
          if [ "${{ matrix.scheme }}" = "rootless" ]; then
            make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          else
            make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=
          fi

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SplitPlay2-${{ matrix.scheme }}-deb
          path: packages/*.deb

