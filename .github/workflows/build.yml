name: Build SplitPlay2 (.deb)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        scheme: [rootless, rootful]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Setup Linux iOS Toolchain & SDK
        run: |
          mkdir -p ~/theos/toolchain
          curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJvf - -C ~/theos/toolchain/

          mkdir -p ~/theos/sdks
          curl -LO https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          tar -xf iPhoneOS16.5.sdk.tar.xz -C ~/theos/sdks
          rm -f iPhoneOS16.5.sdk.tar.xz
          ls -la ~/theos/sdks/


      - name: Build Tweak (.deb)
        run: |
          set -o pipefail
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          make clean
          if [ "${{ matrix.scheme }}" = "rootless" ]; then
            make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless 2>&1 | tee build.log
          else
            make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME= 2>&1 | tee build.log
          fi
          ls -la packages/ || true

      - name: Post Build Log to Summary
        if: always()
        run: |
          echo "## Build Log (${{ matrix.scheme }})" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 120 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.scheme }}
          path: build.log

      - name: Upload .deb Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SplitPlay2-${{ matrix.scheme }}-deb
          path: packages/*.deb







