name: Build SplitPlay2 (.deb)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        scheme: [rootless, rootful]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Setup Linux iOS Toolchain & SDK
        run: |
          mkdir -p ~/theos/toolchain
          curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJvf - -C ~/theos/toolchain/

          mkdir -p ~/theos/sdks
          curl -LO https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          tar -xf iPhoneOS16.5.sdk.tar.xz -C ~/theos/sdks
          rm -f iPhoneOS16.5.sdk.tar.xz
          ls -la ~/theos/sdks/

      - name: Build Tweak (.deb)
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          make clean
          if [ "${{ matrix.scheme }}" = "rootless" ]; then
            make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless > build.log 2>&1 || true
          else
            make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME= > build.log 2>&1 || true
          fi
          echo "=== BUILD LOG ==="
          cat build.log | tail -n 80

      - name: Commit Output to Repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p dist
          cp build.log "dist/build-${{ matrix.scheme }}.log" || true
          cp packages/*.deb "dist/" 2>/dev/null || true
          git add dist/
          git commit -m "Auto: build artifacts and log for ${{ matrix.scheme }}" || true
          git pull --rebase origin main || true
          git push origin main || true

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SplitPlay2-${{ matrix.scheme }}-deb
          path: packages/*.deb








